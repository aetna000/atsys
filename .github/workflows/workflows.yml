name: Publish AtSys

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'atsys'
          assert os.environ['RELEASE_TAG'] == f"v{project['version']}", 'Tag/version mismatch'
          PY
      - name: Test and build application
        run: |
          npm ci
          npm test
          npm run format:check
          npm run build:python
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build --outdir release
          python -m twine check release/*
      - name: Verify installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/atsys-wheel-test"
          "$RUNNER_TEMP/atsys-wheel-test/bin/python" -m pip install release/*.whl
          "$RUNNER_TEMP/atsys-wheel-test/bin/python" tests/packaging/test_install.py -v
          "$RUNNER_TEMP/atsys-wheel-test/bin/python" tests/packaging/test_hooks_sdk.py -v
          "$RUNNER_TEMP/atsys-wheel-test/bin/python" tests/packaging/test_terminal.py -v
          "$RUNNER_TEMP/atsys-wheel-test/bin/python" tests/packaging/test_providers.py -v
      - name: Verify optional AtBot and Pydantic AI hooks without model calls
        run: |
          "$RUNNER_TEMP/atsys-wheel-test/bin/python" -m pip install 'atbots>=0.2.0,<0.3'
          "$RUNNER_TEMP/atsys-wheel-test/bin/python" tests/packaging/test_atbot_hooks.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: release/
          if-no-files-found: error

  pypi:
    name: Publish tested distributions
    if: github.ref_type == 'tag'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/atsys
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
